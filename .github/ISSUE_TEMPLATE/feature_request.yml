name: Feature Request
description: Propose a new pacing feature, playback option, or utility script.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement for the automation suite.
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the proposed productivity feature.
    validations:
      required: true
